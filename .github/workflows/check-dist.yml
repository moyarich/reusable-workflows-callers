name: Check distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    name: Check example package distribution
    uses: moyarich/reusable-workflows/.github/workflows/reusable_check-dist.yml@main
    with:
      dist-path: packages/example/dist/
      build-command: npm run build --workspace @template/example
      node-version: "24"
      artifact-name: example-dist
