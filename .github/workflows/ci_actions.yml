name: CI / GitHub Action bundles
on:
  workflow_call:
    inputs:
      checkout-sha:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate (e.g. after self-heal)
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Rebuild generated GitHub Actions when configured
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e 'process.exit(require("./package.json").scripts?.["build:actions"] ? 0 : 1)'; then
            echo "No build:actions script; skipping action distribution checks."
            exit 0
          fi
          # Remove generated bundles only; never delete authored action metadata.
          npm run build:actions
          git diff --exit-code -- actions/ packages/actions/actions/ packages/actions/scripts/ packages/cli/src/
          if [[ -n "$(git ls-files --others --exclude-standard -- actions/)" ]]; then
            echo "::error::Uncommitted generated actions found"
            git ls-files --others --exclude-standard -- actions/
            exit 1
          fi
