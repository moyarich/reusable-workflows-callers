name: Issue dependencies · Manage

on:
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      issue:
        description: Issue number or URL
        type: string
        required: true
      relationship:
        description: Relationship to related issues
        type: choice
        options: [blocked-by, blocking]
        default: blocked-by
      action:
        description: Add or remove a dependency
        type: choice
        options: [add, remove]
        default: add
      related_issues:
        description: Related issue numbers or URLs, comma-separated
        type: string
        required: true
      dry_run:
        description: Preview without changing issues
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  manage:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_manage-issue-dependencies.yml@main
    with:
      issue: ${{ inputs.issue }}
      relationship: ${{ inputs.relationship }}
      action: ${{ inputs.action }}
      related_issues: ${{ inputs.related_issues }}
      dry_run: ${{ inputs.dry_run }}
