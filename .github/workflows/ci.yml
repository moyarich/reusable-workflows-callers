name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck=
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "## Workflow syntax — $STATUS" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Monorepo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Preview release-draft formatting
        run: |
          npx prettier --write .github/workflows/release-draft.yml
          echo '___BEGIN_PRETTIER_RELEASE_DRAFT___'
          cat .github/workflows/release-draft.yml
          echo '___END_PRETTIER_RELEASE_DRAFT___'
      - run: npm run checks
      - run: npm run pack:check
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "## Monorepo checks — $STATUS" >> "$GITHUB_STEP_SUMMARY"
