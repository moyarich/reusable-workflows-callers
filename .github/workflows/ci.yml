
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact healed commit SHA to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.repository }}-${{ inputs.checkout-sha || github.ref }}
  cancel-in-progress: false

jobs:
  lint-workflows:
    name: Validate workflow syntax
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_actionlint.yml@main

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run Vitest
        id: vitest
        run: npx --no-install vitest run

      - name: Run Typecheck
        id: typecheck
        shell: bash
        run: |
          npm run typecheck --workspaces --if-present
      
          if [[ -f tsconfig.tests.json ]]; then
            npx --no-install tsc -p tsconfig.tests.json --noEmit
          elif [[ -f tsconfig.json ]]; then
            npx --no-install tsc -p tsconfig.json --noEmit
          else
            echo "No TypeScript configuration found; skipping tsc."
          fi
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "## Checks — $STATUS" >> "$GITHUB_STEP_SUMMARY"

  playwright-changes:
    name: Detect Playwright changes
    runs-on: ubuntu-latest
    outputs:
      run-playwright: ${{ steps.decision.outputs.run-playwright }}
    steps:
      - name: Find changed Playwright specs or configuration
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            playwright:
              - '**/*.spec.*'
              - '**/*.specs.*'
              - '**/playwright.config.*'
              - '.github/workflows/ci.yml'

      - name: Decide whether browser tests are required
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAYWRIGHT_CHANGED: ${{ steps.filter.outputs.playwright }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$PLAYWRIGHT_CHANGED" == "true" ]]; then
            echo "run-playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-playwright=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    name: Playwright browser tests
    needs: playwright-changes
    if: needs.playwright-changes.outputs.run-playwright == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Check for installed Playwright
        id: playwright-package
        shell: bash
        run: |
          if node -e "require.resolve('@playwright/test')"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Playwright is not installed; skipping browser tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        if: steps.playwright-package.outputs.available == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright
        if: steps.playwright-package.outputs.available == 'true'
        run: npx --no-install playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
