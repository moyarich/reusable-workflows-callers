name: Copy shared workflow callers

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview generated changes without pushing
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/copy.yml
      - .github/workflows/ci.yml
      - .github/workflows/ci_*.yml
      - .github/workflows/copy.yml
      - scripts/copy-workflows.py

permissions:
  contents: read

concurrency:
  group: copy-shared-workflow-callers
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet 'ruamel.yaml>=0.18,<0.20'
      - id: config
        name: Validate destinations and build matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from ruamel.yaml import YAML
          config = YAML(typ="safe").load(open(".github/copy.yml"))
          files = config["source-files"]
          assert isinstance(files, list) and len(files) and len(files) == len(set(files))
          targets = config["repositories"]
          assert isinstance(targets, list) and targets
          names = [t["name"] for t in targets]
          assert len(names) == len(set(names))
          for target in targets:
              assert re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", target["name"])
              assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", target["branch"])
              assert ".." not in target["branch"]
          matrix = {"include": [{"name": t["name"], "branch": t["branch"]} for t in targets]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY

  copy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet 'ruamel.yaml>=0.18,<0.20'
      - name: Generate repository-specific workflows
        env:
          DEST_REPO: ${{ matrix.name }}
        run: |
          python3 scripts/copy-workflows.py --repository "$DEST_REPO" --output "$RUNNER_TEMP/generated"
      - name: Compare generated workflows against destination
        env:
          GH_TOKEN: ${{ secrets._WORKFLOW_TOKEN }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::_WORKFLOW_TOKEN is required to access the destination repositories."
            exit 1
          fi
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone --depth 1 --branch "$DEST_BRANCH" "https://github.com/$DEST_REPO.git" "$RUNNER_TEMP/destination"
          cd "$RUNNER_TEMP/destination"
          cp -R "$RUNNER_TEMP/generated/.github/." .github/
          git add .github/workflows/
          if git diff --cached --quiet; then
            echo "No workflow changes for $DEST_REPO" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## $DEST_REPO" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: no commit pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): sync shared workflow callers from $GITHUB_REPOSITORY@$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:$DEST_BRANCH"
