name: Sync copier destination choices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: sync-copy-destination-choices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout callers
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout central configuration and CLI
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: main
          path: central
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Synchronize destination choices
        run: >-
          node central/actions/cli/index.mjs sync-workflow-choices
          --source central/.github/copy-files-config.yml
          --values-path repositories
          --value-field name
          --prepend all
          --default all
          --workflow .github/workflows/copy-files-to-another-repository.yml
          --input repository
      - name: Synchronize canonical workflow choices
        run: >-
          node central/actions/cli/index.mjs copy-workflow-choices
          --config central/.github/copy-files-config.yml
          --source-directory .github/workflows
          --workflow .github/workflows/copy-files-to-another-repository.yml
      - name: Format dispatcher
        run: npx --yes prettier@3.6.2 --write .github/workflows/copy-files-to-another-repository.yml
      - name: Commit synchronized choices
        env:
          WORKFLOW_TOKEN: ${{ secrets._WORKFLOW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/copy-files-to-another-repository.yml
          if git diff --quiet -- "$target"; then
            echo "Copier workflow choices already current"
            exit 0
          fi
          if [[ -z "$WORKFLOW_TOKEN" ]]; then
            echo "::error::Missing _WORKFLOW_TOKEN with workflow and contents write permissions"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'chore(actions): sync copier choices from central inventory'
          auth="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main
