name: Self-heal → CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair:
        description: Preventive repairs
        type: choice
        default: all
        options: [all, package-lock, prettier]
      commit:
        description: Commit repaired files
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
  packages: read
concurrency:
  group: self-heal-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  self-heal-ci:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_self-heal.yml@main
    with:
      required-workflow: ci_cli.yml
      target-branch: ${{ github.ref_name }}
      node-version: "24"
      repair: ${{ inputs.repair || 'all' }}
      commit: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
