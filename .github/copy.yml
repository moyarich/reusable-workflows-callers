# Central source: moyarich/reusable-workflows-callers
# Every destination explicitly opts into individual canonical workflow files.
# Destination updates open reviewable pull requests; do not auto-merge them.
# Repository-specific workflows not listed here are never copied or deleted.
source-files:
  - .github/workflows/check-dist.yml
  - .github/workflows/ci.yml
  - .github/workflows/ci_actionlint.yml
  - .github/workflows/ci_cli.yml
